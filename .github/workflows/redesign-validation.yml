name: GSK Vue and Android validation

permissions:
  contents: write

on:
  push:
    branches:
      - redesign/premium-android-app
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'vite.config.*'
      - '.github/workflows/**'

jobs:
  web-and-android:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ci-placeholder-api-key
      VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-placeholder-project
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: '1:000000000000:web:ci-placeholder'
      VITE_FIREBASE_VAPID_KEY: ci-placeholder-vapid-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit
      - name: Run static lint checks
        run: npx oxlint .
      - name: Build production web application
        run: npm run build
      - name: Add the Android platform if it is missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Preserve generated Android project in the redesign branch
        run: |
          if [ -d android ] && [ -n "$(git status --porcelain -- android)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android
            git commit -m "Add Capacitor Android platform project"
            git push
          fi
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gsk-app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
